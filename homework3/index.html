
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="High-concurrency flash-sale engine">
  <title>Flash Sale Engine</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">FLASH SALE ENGINE</p>
      <h1>Midnight Flash Sale</h1>
      <p>Zero-drift countdown demonstration</p>
    </header>

    <section class="countdown-card" aria-labelledby="countdown-title">
      <h2 id="countdown-title">Sale ends in</h2>

      <div
        class="countdown"
        role="timer"
        aria-label="Time remaining until the flash sale ends"
      >
        <div class="time-unit">
          <span id="hours">00</span>
          <small>Hours</small>
        </div>

        <span class="separator" aria-hidden="true">:</span>

        <div class="time-unit">
          <span id="minutes">00</span>
          <small>Minutes</small>
        </div>

        <span class="separator" aria-hidden="true">:</span>

        <div class="time-unit">
          <span id="seconds">00</span>
          <small>Seconds</small>
        </div>
      </div>

      <p id="countdown-status" class="status">
        Initializing countdown...
      </p>
    </section>
  </main>
</body>
</html>
