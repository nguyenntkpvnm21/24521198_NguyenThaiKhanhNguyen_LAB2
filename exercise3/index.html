<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="A resilient data feed demonstrating asynchronous state management and skeleton loading."
  >

  <title>Exercise 3 | Resilient Data Feed</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="app-container">
    <header class="app-header">
      <h1>Resilient Data Feed</h1>

      <p>
        Exercise 3: Finite State Machine &
        Skeleton Loader
      </p>
    </header>

    <section
      class="feed-section"
      aria-labelledby="feed-heading"
    >
      <h2 id="feed-heading">Data Feed</h2>

      <div
        id="app"
        aria-live="polite"
        aria-atomic="true"
      ></div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
